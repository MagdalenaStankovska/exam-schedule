<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Edit the Subject Exam</title>
</head>
<body>
<div class="mt-4" layout:fragment="content">
    <div class="container w-50 m-auto ">
        <div>
            <a th:href="@{/admin/subject-exam}" class="text-decoration-none">
                <button type="button" class="btn btn-secondary btn-sm m-2 mb-3">Go back
                </button>
            </a>
            <p class="h3 d-inline-block m-2">
                Edit Subject Exam</p>
        </div>
        <form method="POST" th:action="@{'/admin/subject-exam/{name}' (name=${se?.getId()})}">
            <div class="row my-2">
                <div class="col">
                    <label for="name">Name:</label>
                    <input type="text"
                           class="form-control"
                           id="name"
                           name="name"
                           th:value="${se.definition.subject.name}"
                           disabled>
                </div>
                <div class="col">
                    <label for="examSession">Year Exam Session:</label>
                    <select id="examSession" name="session" class="form-control">
                        <option th:each="examSession: ${sessions}"
                                th:text="${examSession.name}"
                                th:value="${examSession.name}"
                                th:selected="${se!= null && se.session.name == examSession.name}"
                        ></option>
                    </select>
                </div>
            </div>

            <div class="row my-2">
                <div class="col">
                    <label for="previousYearAttendantsNumber">Previous Year Attendants Number:</label>
                    <input type="number"
                           class="form-control"
                           id="previousYearAttendantsNumber"
                           name="previousYearAttendantsNumber"
                           th:value="${se?.previousYearAttendantsNumber}"
                    >
                </div>
                <div class="col">
                    <label for="previousYearTotalStudents">Previous Year Total Students:</label>
                    <input type="number"
                           class="form-control"
                           id="previousYearTotalStudents"
                           name="previousYearTotalStudents"
                           th:value="${se?.previousYearTotalStudents}"
                    >
                </div>
            </div>
            <label for="attendantsNumber">Attendants Number:</label>
            <input type="number"
                   class="form-control"
                   id="attendantsNumber"
                   name="attendantsNumber"
                   th:value="${se?.attendantsNumber}"
            >
            <div class="row my-2">
                <div class="col">

                    <div class="col">
                        <label for="durationMinutes">Duration in Minutes:</label>
                        <input type="text"
                               class="form-control"
                               id="durationMinutes"
                               name="durationMinutes"
                               th:value="${se?.durationMinutes}"
                        >
                    </div>
                </div>

                <div class="col">
                    <label for="numRepetitions">Num Repetitions:</label>
                    <input type="text"
                           class="form-control"
                           id="numRepetitions"
                           name="numRepetitions"
                           th:value="${se?.numRepetitions}"
                    >
                </div>

            </div>
            <div class="row my-2">
                <div class="col">
                    <label for="fromTime">From time:</label>
                    <input type="datetime-local"
                           class="form-control"
                           id="fromTime"
                           name="fromTime"
                           th:value="${se?.fromTime}"
                    >
                </div>
                <div class="col">
                    <label for="toTime">To time:</label>
                    <input type="datetime-local"
                           class="form-control"
                           id="toTime"
                           name="toTime"
                           th:value="${se?.toTime}"
                    >
                </div>
            </div>

            <label for="roomNames">Rooms:</label>
            <select class="form-control" id="roomNames" name="roomNames" multiple >
                <option th:each="room : ${rooms}" th:value="${room.name}" th:text="${room.name}"
                        th:selected="${se != null && se.getRooms().contains(room)}">
                </option>
            </select>

            <label for="comment">Comment:</label>
            <input type="text"
                   class="form-control"
                   id="comment"
                   name="comment"
                   th:value="${se?.comment}">

            <button type="submit" class="btn btn-success my-3 w-100">Submit</button>
        </form>
    </div>
</div>
</body>
</html>
