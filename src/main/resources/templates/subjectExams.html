<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="en">
<head>
    <meta charset="UTF-8">
    <title>SubjectExams</title>
    <script th:inline="javascript">
        function updateTime(event) {
            event.preventDefault();
            event.stopPropagation();
            var button = event.target;
            var id = button.getAttribute('data-id');

            var fromTimeValue = document.getElementById('fromTimeInput-' + id).value;
            var toTimeValue = document.getElementById('toTimeInput-' + id).value;
            var data = {
                id: id,
                fromTime: fromTimeValue,
                toTime: toTimeValue
            };

            fetch('/admin/subject-exam/' + id + '/update-time', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        alert("Updated time of " + id + " successfully")
                    } else {
                        alert('Failed to update time of ' + id);
                    }
                })
                .catch(error => {
                    console.error('Error updating  time:', error);
                });
        }

        function updateSelectedValue() {
            var selectElement = document.getElementById("yes");
            if (!selectElement) {
                return;
            }
            var selectedValue = selectElement.value;
            ["selectedValueInput", "selectedValueInput2", "selectedValueInput3", "selectedValueInput4", "selectedValueInput5", "selectedValueInput6", "selectedValueInput7"].forEach(function (id) {
                var input = document.getElementById(id);
                if (input) {
                    input.value = selectedValue;
                }
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            updateSelectedValue();
        });

        function updateNumRepetitions(event) {
            var button = event.target;
            var id = button.getAttribute('data-id');
            var repetitions = document.getElementById("repetitions-" + id).value;

            var data = {
                id: id,
                repetitions: repetitions
            };

            fetch('/admin/subject-exam/' + id + '/update-repetitions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify(data)
            })
                .then(response => {
                    if (response.ok) {
                        alert("Updated repetitions for " + id + " successfully")
                    } else {
                        alert('Failed to update repetitions for ' + id);
                    }
                })
                .catch(error => {
                    console.error('Error updating  repetitions:', error);
                });
        }
    </script>
</head>
<body>
<div class="mt-4" layout:fragment="content">
    <div class="m-2">
        <h2>Subject Exams</h2>
        <div th:if="${error!=null}" class="alert" th:classappend="${#strings.contains(error,'Success') ? ' alert-success' : ' alert-danger'}">
          <p>Status:</p>  <p th:text="${error}"></p>
        </div>
        <form th:action="@{'subject-exam'}">
            <div class="row">
                <div class="col-md-3">
                    <label for="search">Search:</label>
                    <input type="text" class="form-control" th:value="${search}" id="search" name="search"/>
                </div>
                <div class="col-md-3">
                    <label for="room">Room:</label>
                    <select class="form-control d-inline-block" id="room" name="room">
                        <option value=""></option>
                        <option th:each="room: ${rooms}" th:text="${room.name}" th:value="${room.name}"
                                th:selected="${room.name == roomFilter}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="cycle">Cycle:</label>
                    <select class="form-control d-inline-block" id="cycle" name="cycle">
                        <option value=""></option>
                        <option th:each="cycle: ${cycles}" th:text="${cycle}" th:value="${cycle}"
                                th:selected="${cycle.name() == cycleFilter}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary mt-4">Apply Filters</button>
                    <a href="/admin/subject-exam" class="btn btn-secondary mt-4">Clear Filters</a>
                </div>
            </div>
        </form>
        <div class="row">
            <div class="col-2  m-2">
                <select class="form-control" id="yes" name="yes" onchange="updateSelectedValue(this)">
                    <option th:if="${#lists.isEmpty(yearExamSessions)}" value="" selected>No exam sessions available</option>
                    <option th:each="ses: ${yearExamSessions}" th:text="${ses.name}" th:value="${ses.name}">
                    </option>
                </select>
            </div>
            <div class="col m-2">
                <div class="row row-cols-auto">
                    <form th:action="@{'subject-exam/initialize'}" method="get" class="col" sec:authorize="hasRole('ADMIN')">
                        <input type="hidden" id="selectedValueInput" name="yes" th:value="${selectedValue}"/>
                        <button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(yearExamSessions)}">Initialize</button>
                    </form>
                    <form th:action="@{'subject-exam/calculate'}" method="post" class="col" sec:authorize="hasRole('ADMIN')">
                        <input type="hidden" id="selectedValueInput2" name="yes" th:value="${selectedValue}"/>
                        <button type="submit" class="btn btn-primary" th:disabled="${#lists.isEmpty(yearExamSessions)}">Calculate</button>
                    </form>
                    <form th:action="@{'/admin/scheduling/generate'}" method="post" class="col" sec:authorize="hasRole('ADMIN')">
                        <input type="hidden" id="selectedValueInput3" name="yes" th:value="${selectedValue}"/>
                        <button type="submit" class="btn btn-success" th:disabled="${#lists.isEmpty(yearExamSessions)}">Generate Schedule</button>
                    </form>
                    <form th:action="@{'/admin/scheduling/finalize'}" method="post" class="col" sec:authorize="hasRole('ADMIN')">
                        <input type="hidden" id="selectedValueInput4" name="yes" th:value="${selectedValue}"/>
                        <button type="submit" class="btn btn-dark" th:disabled="${#lists.isEmpty(yearExamSessions)}">Finalize</button>
                    </form>
                    <form th:action="@{'/admin/schedule-export/__SESSION__'}" method="get" class="col" sec:authorize="hasRole('ADMIN')"
                          onsubmit="this.action='/admin/schedule-export/' + document.getElementById('selectedValueInput5').value;">
                        <input type="hidden" id="selectedValueInput5" name="yes" th:value="${selectedValue}"/>
                        <input type="hidden" name="format" value="csv"/>
                        <button type="submit" class="btn btn-outline-secondary" th:disabled="${#lists.isEmpty(yearExamSessions)}">CSV</button>
                    </form>
                    <form th:action="@{'/admin/schedule-export/__SESSION__'}" method="get" class="col" sec:authorize="hasRole('ADMIN')"
                          onsubmit="this.action='/admin/schedule-export/' + document.getElementById('selectedValueInput6').value;">
                        <input type="hidden" id="selectedValueInput6" name="yes" th:value="${selectedValue}"/>
                        <input type="hidden" name="format" value="xlsx"/>
                        <button type="submit" class="btn btn-outline-secondary" th:disabled="${#lists.isEmpty(yearExamSessions)}">XLSX</button>
                    </form>
                    <form th:action="@{'/admin/schedule-export/__SESSION__'}" method="get" class="col" sec:authorize="hasRole('ADMIN')"
                          onsubmit="this.action='/admin/schedule-export/' + document.getElementById('selectedValueInput7').value;">
                        <input type="hidden" id="selectedValueInput7" name="yes" th:value="${selectedValue}"/>
                        <input type="hidden" name="format" value="pdf"/>
                        <button type="submit" class="btn btn-outline-secondary" th:disabled="${#lists.isEmpty(yearExamSessions)}">PDF</button>
                    </form>
                </div>
                <div class="alert alert-info mt-2 mb-0" th:if="${#lists.isEmpty(yearExamSessions)}" sec:authorize="hasRole('ADMIN')">
                    No exam sessions found. Create one first at
                    <a href="/admin/exam-session/add" class="alert-link">Add Exam Session</a>.
                </div>
            </div>
        </div>
    </div>
    <div class="mt-2">
        <table class="table table-striped text-center align-middle mt-1">
            <tr class="">
                <th style="width: 15%;">Subject</th>
                <th style="width: 15%;">Session</th>
                <th style="width: 5%;">Duration</th>
                <th style="width: 5%;">Attendants</th>
                <th style="width: 5%;">Total Students</th>
                <th style="width: 5%;">Expected Number</th>
                <th style="width: 8%;">Workflow</th>
                <th style="width: 10%;">Repetitions</th>
                <th style="width: 18%;">Rooms</th>
                <th style="width: 5%;">From</th>
                <th style="width: 5%;">To</th>
                <th style="width: 5%;"></th>
                <th style="width: 5%;">Actions</th>
            </tr>
            <tr class="align-items-center" th:each="se: ${page.content}">
                <td class=" align-middle" th:text="${se.definition.subject.name}"></td>
                <td class=" align-middle" th:text="${se.session.name}"></td>
                <td class=" align-middle" th:text="${se.durationMinutes}"></td>
                <td class=" align-middle" th:text="${se.attendantsNumber}"></td>
                <td class=" align-middle" th:text="${se.totalStudents}"></td>
                <td class=" align-middle" th:text="${se.expectedNumber}"></td>
                <td class=" align-middle" th:text="${se.workflowStatus}"></td>
                <td class=" align-middle">
                    <input type="text" th:value="${se.numRepetitions}" class="form-control  m-0 text-align-center"
                           th:id="'repetitions-' + ${se.id}">
                    <button class="btn btn-sm btn-success m-1 save-item"
                            th:attr="data-id=${se.id}"
                            onclick="updateNumRepetitions(event);">Update
                    </button>
                </td>
                <td>
                    <ul class="list-group list-unstyled">
                        <th:block th:each="room : ${se.rooms}">
                            <li class="de">
                                <th:block>
                                    <a class="edit-item"
                                       th:href="@{'/admin/subject-exam/{seId}/{roomName}' (seId=${se.id}, roomName=${room.name})}">
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-secondary rounded-2 d-inline-flex align-items-center my-1 edit-item"
                                                style="padding-left: 0.625rem !important; padding-right: 0.625rem !important;">
                                            <span th:text="${room.name}"></span>
                                            <span class="ms-2">&times;</span>
                                        </button>
                                    </a>
                                </th:block>
                            </li>
                        </th:block>
                    </ul>
                </td>
                <td class="w-auto">
                    <input type="datetime-local"  class="form-control " style="width:30vh; "
                           th:id="'fromTimeInput-' + ${se.id}"
                           th:value="${se.fromTime != null ? #temporals.format(se.fromTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
                </td>
                <td id="toTimeCell">
                    <input type="datetime-local" class="form-control" style="width:30vh;"
                           th:id="'toTimeInput-' + ${se.id}"
                           th:value="${se.toTime != null ? #temporals.format(se.toTime, 'yyyy-MM-dd''T''HH:mm') : ''}">
                </td>
                <td>
                    <button type="button" class="btn btn-sm btn-success m-1 save-item"
                            th:attr="data-id=${se.id}"
                            onclick="updateTime(event);">Update time
                    </button>
                </td>
                <td>
                    <th:block>
                        <a class="edit-item" th:href="@{'/admin/subject-exam/{name}/edit' (name=${se.id})}">
                            <button type="submit" class="btn btn-sm btn-primary m-1 edit-item">Edit</button>
                        </a>
                    </th:block>
                    <th:block sec:authorize="hasRole('PROFESSOR')">
                        <form method="post" th:action="@{'/professor/subject-exam/{name}/submit' (name=${se.id})}">
                            <input type="number" min="1" name="expectedStudents" class="form-control form-control-sm my-1" placeholder="Expected" required>
                            <button type="submit" class="btn btn-sm btn-outline-primary m-1">Submit expected</button>
                        </form>
                    </th:block>
                    <th:block>
                        <form method="post" th:action="@{'/admin/subject-exam/{name}/recalculate' (name=${se.id})}">
                            <button type="submit" class="btn btn-sm btn-warning  text-light m-1">Recalculate</button>
                        </form>
                    </th:block>
                    <th:block sec:authorize="hasRole('ADMIN')">
                        <form method="post" th:action="@{'/admin/subject-exam/{name}/delete' (name=${se.id})}">
                            <button type="submit" class="btn btn-sm btn-danger m-1 delete-item">Delete</button>
                        </form>
                    </th:block>
                </td>
            </tr>
        </table>
        <div class="mt-3" th:include="fragments/paging :: pageSection(${page})"></div>
    </div>
</div>
</body>
</html>
