<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="">
<head>
    <meta charset="UTF-8">
    <title>SubjectExams</title>
</head>
<body>
<div class="" layout:fragment="content">
    <div class="w-75 ml-5 my-3">
        <form th:action="@{''}" method="get">
            <div class="row">
                <div class="col-md-3">
                    <label for="search" class="fs-6">Search</label>
                    <input type="text" class="form-control" id="search" name="search"/>
                </div>
                <div class="col-md-3">
                    <label for="room" class="fs-6">Room:</label>
                    <select class="form-control" id="room" name="room">
                        <option value="">All</option>
                        <option th:each="room: ${rooms}" th:text="${room.name}" th:value="${room.name}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="cycle" class="fs-6">Cycle:</label>
                    <select class="form-control" id="cycle" name="cycle">
                        <option value="">All</option>
                        <option th:each="cycle: ${cycles}" th:text="${cycle}" th:value="${cycle}">
                        </option>
                    </select>
                </div>
                <div class="col-md-3 mt-4">
                    <button class="btn btn-success w-50 fs-6">Apply Filters</button>
                </div>
            </div>
        </form>
    </div>
    <div class="row">
        <div class="col-9">
            <h2>Subject Exams</h2>
            <div class="table-responsive">
                <table class="table table-bordered table-striped text-center">
                    <thead class="table-header table-striped">
                    <tr class="border border-dark">
                        <th style="width: 15%;">Subject</th>
                        <th style="width: 15%;">Session</th>
                        <th style="width: 5%;">Duration</th>
                        <th style="width: 5%;">Attendants</th>
                        <th style="width: 5%;">Total Students</th>
                        <th style="width: 5%;">Expected Number</th>
                        <th style="width: 5%;">Repetitions</th>
                        <th style="width: 10%;">Rooms</th>
                        <th style="width: 10%;">From</th>
                        <th style="width: 10%;">To</th>
                        <th style="width: 5%;">Comment</th>
                        <th style="width: 6%;">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="se: ${page.content}">
                        <td class="border border-dark align-middle" th:text="${se.definition.subject.name}"></td>
                        <td class="border border-dark align-middle" th:text="${se.session.name}"></td>
                        <td class="border border-dark align-middle" th:text="${se.durationMinutes}"></td>
                        <td class="border border-dark align-middle" th:text="${se.attendantsNumber}"></td>
                        <td class="border border-dark align-middle" th:text="${se.totalStudents}"></td>
                        <td class="border border-dark align-middle" th:text="${se.expectedNumber}"></td>
                        <td class="border border-dark align-middle" th:text="${se.numRepetitions}"></td>
                        <td class="border border-dark align-middle">
                            <ul class="list-group">
                                <li class="list-group-item" th:each="room : ${se.rooms}">
                                    <span th:text="${room.name}"></span>
                                </li>
                            </ul>
                        </td>
                        <td class="border border-dark align-middle"
                            th:text="${#strings.replace(se.fromTime, 'T', ' ')}"></td>
                        <td class="border border-dark align-middle"
                            th:text="${#strings.replace(se.toTime, 'T', ' ')}"></td>
                        <td class="border border-dark align-middle" th:text="${se.comment}"></td>
                        <td class="border border-dark align-middle">
                            <th:block>
                                <form method="post" th:action="@{'/admin/subject-exam/{name}/delete' (name=${se.id})}">
                                    <button type="submit" class="btn btn-sm btn-danger m-1 delete-item">Delete</button>
                                </form>
                                <a class="edit-item" th:href="@{'/admin/subject-exam/{name}/edit' (name=${se.id})}">
                                    <button type="submit" class="btn btn-sm btn-primary m-1 edit-item">Edit</button>
                                </a>
                            </th:block>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="mt-3" th:include="fragments/paging :: pageSection(${page})"></div>
        </div>
        <div class="col-3 px-3">
            <form th:action="@{'subject-exam/initialize'}">
                <div class="row">
                    <div class="col-6 w-50 mt-5">
                        <select class="form-control" id="yes" name="yes">
                            <option th:each="ses: ${yearExamSessions}" th:text="${ses.name}"
                                    th:value="${ses.name}"></option>
                        </select>
                    </div>
                    <div class="col-6 mt-5">
                        <button type="submit" class="btn btn-primary">Initialize</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
