<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Exam Calendar</title>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <style>
    .side-panel { width: 200px; padding: 1em; background: #fafafa; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    .side-panel input { width: 100%; }
    #Table {
      table-layout: fixed; width: 100%;
      border-color: gray; border-width: 1px;
      box-shadow: 2px 0 5px rgba(0,0,0,0.1);
      overflow-y: hidden; margin-left: 0; margin-right: 0;
    }
    #Table > tbody > tr {
      height: 60px;
    }
    #Table > tbody > tr > th, #Table > thead > tr > th {
      background-color: lightgrey; align-items: center;
      text-align: center; padding: 10px; width:15%;
    }
    #Table > thead > tr > th, #Table > tbody > tr > td  {
      text-align: center; vertical-align: middle;
      width: 69px; min-width: 69px;
    }
    #Table > tbody > tr > td { padding: 0 }
    .exam {
      display: flex; cursor: pointer;
      align-items: center; justify-content: center;
      width: 100%; height: 100%; min-height: 100%;
      background: #9cf; color: #000; font-size: 12px;
      box-sizing: border-box;
      border-radius: 3px; box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
    .exam.overlap { background:#e57373; }
    .container-fluid.ps-5.pe-5 { padding-left: 0.25rem !important; padding-right: 0 !important; }
    .col-10 { margin-left: 0 !important; margin-right: 0 !important; }
    body > header { width: 100%; }
  </style>
</head>
<body>
<div layout:fragment="content">
  <div class="row mt-3 me-0">
    <div class="col-2">
      <div class="side-panel">
        <label>Select date:</label>
        <input type="date" id="datePicker" th:value="${date}" />
      </div>
      <div id="noRoomExamsContainer" class="mt-4" style="display:none">
        <h5 class="ms-2">Exams without rooms:</h5>
        <div id="noRoomExamList" class="list-group"></div>
      </div>
    </div>

    <div class="col-10 ms-0">
      <table id="Table" class="table table-bordered">
        <thead>
        <tr>
          <th>Time</th>
          <th th:each="room : ${rooms}" th:text="${room.name}" th:attr="data-room=${room.name}"></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="hour : ${#numbers.sequence(8,20)}">
          <th th:text="${hour < 10 ? '0' + hour : hour} + ':00'" th:class="${hour < 10 ? '0' + hour : hour} + ':00'"></th>
          <td th:each="room : ${rooms}" th:value="${room.getName()}" th:class="${room.getName()}"></td>
        </tr>
        </tbody>
      </table>
    </div>
    <div>
      <div class="modal fade" id="examModal" tabindex="-1" aria-labelledby="examModalLabel" aria-hidden="true">
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="examModalLabel">Exam Details</h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <p><strong>Subject:</strong> <span id="modalSubject"></span></p>
              <p><strong>Session:</strong> <span id="modalSession"></span></p>
              <p><strong>Duration:</strong> <span id="modalDuration"></span></p>
              <p><strong>From:</strong> <span id="modalFrom"></span></p>
              <p><strong>To:</strong> <span id="modalTo"></span></p>
              <p><strong>Rooms:</strong> <span id="modalRooms"></span></p>
              <div id="modalCommentContainer">
                <p><strong>Comment:</strong> <span id="modalNote"></span></p>
              </div>
              <div id="modalOverlapContainer">
                <p><strong>Conflicts with:</strong></p>
                <ul id="modalOverlapList" style="padding-left:1.2em; margin:0;"></ul>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-danger" id="modalEdit">Edit Exam</button>
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    var exams    = /*[[${exams}]]*/ [];
    var overlaps = /*[[${overlaps}]]*/ [];

    document.getElementById('datePicker')
            .addEventListener('change', e => {
            window.location.search = 'date=' + e.target.value;
    });
    document.addEventListener('DOMContentLoaded', () => {
      mapExamsToCells(exams);
    });

    function formatTime(dateString) {
      return new Date(dateString)
              .toLocaleTimeString([], {
                hour12: false,
                hour:   '2-digit',
                minute: '2-digit'
              });
    }

    function mapExamsToCells(exams) {
      renderNoRoomExams(exams);
      const headers = Array.from(
              document.querySelectorAll('#Table thead th[data-room]')
      );
      const rows = Array.from(
              document.querySelectorAll('#Table tbody tr')
      );
      const ExamstoShow = exams.filter(e => e.rooms && e.rooms.length > 0);

      ExamstoShow.forEach(exam => {
        const start = new Date(exam.fromTime);
        const end = new Date(exam.toTime);
        let spanHours = Math.ceil((end - start) / (1000 * 60 * 60));
        if (spanHours < 1) spanHours = 1;

        const hourLabel = String(start.getHours()).padStart(2,'0') + ':00';
        const rowIndex = rows.findIndex(r => r.children[0].textContent.trim() === hourLabel);
        if (rowIndex < 0) {
          console.warn('No row for', hourLabel, exam);
          return;
        }

        exam.rooms.forEach(room => {
          const colIndex = headers.findIndex(h => h.dataset.room === room.name);
          if (colIndex < 0) {
            console.warn('No column for room', room.name, exam);
            return;
          }

          const startRow = rows[rowIndex];
          const cell = startRow.children[colIndex + 1];
          cell.rowSpan = spanHours;
          cell.style.padding = '0';
          cell.innerHTML = '';
          cell.width = '200px';

          const div = document.createElement('div');
          div.classList.add('exam');
          if (overlaps.includes(exam.id)) div.classList.add('overlap');
          div.style.height = '100%';
          div.style.width = '100%';
          div.style.padding = '0';
          div.innerHTML = exam.definition.subject.name;

          div.addEventListener('click', () => {
            document.getElementById('modalSubject').textContent = exam.definition.subject.name;
            document.getElementById('modalSession').textContent = exam.session.name;
            document.getElementById('modalDuration').textContent = exam.durationMinutes + " min.";
            document.getElementById('modalFrom').textContent = formatTime(exam.fromTime);
            document.getElementById('modalTo').textContent = formatTime(exam.toTime);
            document.getElementById('modalRooms').textContent = exam.rooms.map(r => r.name).join(', ');
            const commentContainer = document.getElementById('modalCommentContainer');
            if (exam.comment && exam.comment.trim() !== '') {
              document.getElementById('modalNote').textContent = exam.comment;
              commentContainer.style.display = '';
            } else {
              commentContainer.style.display = 'none';
            }

            document.getElementById('modalEdit').onclick = () =>
                    window.location.href = '/admin/subject-exam/' + exam.id + '/edit';

            const overlappingExams = exams.filter(e => e.id !== exam.id && overlaps.includes(e.id));
            const overlapContainer = document.getElementById('modalOverlapContainer');
            const overlapList = document.getElementById('modalOverlapList');
            if (overlappingExams.length) {
              overlapList.innerHTML = overlappingExams.map(o => {
                const from = formatTime(o.fromTime);
                const to = formatTime(o.toTime);
                const subj = o.definition.subject.name;
                return `${subj} (${from} – ${to})`;
              }).join('');
              overlapContainer.style.display = '';
            } else {
              overlapContainer.style.display = 'none';
            }

            const modalEl = document.getElementById('examModal');
            const examModal = new bootstrap.Modal(modalEl);
            examModal.show();
          });
          cell.appendChild(div);

          for (let i = 1; i < spanHours; i++) {
            const nextRow = rows[rowIndex + i];
            if (!nextRow) break;
            const toRemove = nextRow.children[colIndex + 1];
            if (toRemove) toRemove.remove();
          }
        });
      });
    }

    function renderNoRoomExams(exams) {
      const container = document.getElementById('noRoomExamsContainer');
      const list = document.getElementById('noRoomExamList');
      const header = container.querySelector('h5');

      if (!exams || exams.length === 0) {
        header.textContent = 'No exams on this date.';
        header.classList.add('ms-2');
        list.style.display  = 'none';
        container.style.display = '';
        return;
      }
      const noRooms = exams.filter(e => !e.rooms || e.rooms.length === 0);
      const withRoomsCount = exams.length - noRooms.length;
      if (noRooms.length === 0) {
        header.textContent = `${withRoomsCount} exam ${withRoomsCount > 1 ? 's' : ''} on this date.`;
        header.classList.add('ms-2');
        list.style.display = 'none';
        container.style.display = '';
        return;
      }
      container.style.display = '';
      list.innerHTML = '';

      noRooms.forEach(exam => {
        const item = document.createElement('div');
        item.classList.add('list-group-item','exam','mt-1');
        item.textContent = exam.definition.subject.name + ' (' + formatTime(exam.fromTime) + ' – ' + formatTime(exam.toTime) + ')';

        item.addEventListener('click', () => {
          document.getElementById('modalSubject').textContent = exam.definition.subject.name;
          document.getElementById('modalSession').textContent = exam.session.name;
          document.getElementById('modalDuration').textContent = exam.durationMinutes + ' min.';
          document.getElementById('modalFrom').textContent = formatTime(exam.fromTime);
          document.getElementById('modalTo').textContent = formatTime(exam.toTime);
          document.getElementById('modalRooms').textContent = ' None';

          const cc = document.getElementById('modalCommentContainer');
          if (exam.comment && exam.comment.trim()) {
            document.getElementById('modalNote').textContent = exam.comment;
            cc.style.display = '';
          } else {
            cc.style.display = 'none';
          }

          const overlapContainer = document.getElementById('modalOverlapContainer');
          const overlapList = document.getElementById('modalOverlapList');
          const overlappingExams = exams.filter(e => e.id!==exam.id && overlaps.includes(e.id));
          if (overlappingExams.length) {
            overlapList.innerHTML = overlappingExams.map(o =>
                    `${o.definition.subject.name} (${formatTime(o.fromTime)} – ${formatTime(o.toTime)})`
            ).join('');
            overlapContainer.style.display = '';
          } else {
            overlapContainer.style.display = 'none';
          }

          document.getElementById('modalEdit').onclick = () =>
                  window.location.href = '/admin/subject-exam/' + exam.id + '/edit';

          new bootstrap.Modal(document.getElementById('examModal')).show();
        });
        list.appendChild(item);
      });
    }
  </script>
</div>
</body>
</html>
