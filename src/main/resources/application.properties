
spring.datasource.url=jdbc:postgresql://localhost:54322/finki-services-db
spring.datasource.username=finki_admin
spring.datasource.password=f1nk1_@dm1n

# Temporary dev-safe mode so new entity fields auto-create and app can start.
# After schema is aligned, you can switch back to 'validate'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Shared DB already contains legacy Flyway history from another app.
# Keep startup resilient in local/dev by skipping strict validation.
spring.flyway.validate-on-migrate=false
spring.flyway.ignore-migration-patterns=*:missing

# Optional Gemini integration (schedule suggestions); use environment variable in production.
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent



